# Shared settings for all SkillSync apps (Spring Cloud Config — merged with each service file).
jwt:
  secret: mysecretkeymysecretkeymysecretkey12345

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
