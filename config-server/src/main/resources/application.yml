server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    active: local   # ✅ added

  config:
    import: "optional:classpath:application-default.yml,optional:configserver:http://localhost:8888"

  cloud:
    config:
      server:
        git:
          uri: https://github.com/ashutosh12505/skillsync-config
          default-label: main
          clone-on-start: true
          skip-ssl-validation: false
          timeout: 5

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka   # 🔁 fixed (was Docker service name)

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans   # 🔁 fixed (was Docker service name)